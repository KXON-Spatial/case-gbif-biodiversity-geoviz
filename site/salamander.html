  <h1>台灣特有山椒魚 · 地形暈渲分布</h1>
  <p class="sub">Hynobius spp. — 冰河孑遺的高山活化石</p>

  <img src="salamander.png" alt="台灣特有山椒魚地形暈渲分布圖" />

  <div class="note">
    <p>山椒魚是全台空間分布最「嚴格」的類群之一,僅見於中央山脈高海拔。本圖經過嚴格的
       <b>座標品質清洗</b>:293 筆原始記錄中,有 239 筆的座標不確定性高達 ~30 km
       ——這是<b>瀕危物種座標被刻意模糊化</b>(generalization)的指紋,目的是避免被按圖索驥盜捕。
       清洗後保留 54 筆較精確的記錄,疊在地形暈渲底圖上呈現其高山棲地。</p>
